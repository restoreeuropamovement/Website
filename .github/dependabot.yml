# Dependency updates, proposed as pull requests rather than applied.
#
# The weekly audit in ci.yml answers "is anything we ship known to be broken".
# This answers the slower question behind it — staying close enough to current
# that a security release is a small upgrade rather than a major-version
# migration undertaken in a hurry.
#
# Grouped, because ten separate pull requests a week is how a repository learns
# to ignore them, and every one of them still has to pass `npm run check`.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # The packages that serve requests. Kept apart from tooling so a patch to
      # something in the request path is visible rather than buried in a batch
      # of type definitions.
      runtime:
        dependency-type: production
      tooling:
        dependency-type: development
    # Major bumps that need a person to read the release notes first, so they are
    # not proposed automatically. Next and React move together and are the
    # obvious case. The compiler and the linter are the same kind of upgrade for
    # a less obvious reason: they do not change what the site does, they change
    # what counts as an error, so a major lands as a diff across files nobody
    # meant to touch. Grouping makes that worse rather than better — the first
    # run of this config proposed TypeScript 7, ESLint 10 and a tsx patch as one
    # pull request, which `npm run check` failed as a unit, taking the harmless
    # patch down with it.
    #
    # @types/node is pinned to the runtime's major on purpose. Typings for a
    # newer Node than the one that serves requests describe APIs that are not
    # there, and the compiler stops being able to tell us so.
    ignore:
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
